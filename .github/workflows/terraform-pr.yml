name: Terraform PR Workflow

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan and AI Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan.out > plan.log 2>&1 || true
          echo "PLAN_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$(head -c 8000 plan.log)" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Summarize Plan with ChatGPT
        id: summarize
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Generating ChatGPT summary..."
          SUMMARY=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a DevOps expert summarizing Terraform plans.\"},
                {\"role\": \"user\", \"content\": \"Summarize and explain the following Terraform plan output in a few concise bullet points, highlighting any issues or resources to be created.\\n\\n${{ env.PLAN_OUTPUT }}\"}
              ]
            }" | jq -r '.choices[0].message.content')

          echo "$SUMMARY" > summary.txt
          echo "SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post summary comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### 🧠 Terraform Plan Summary by ChatGPT
            ${{ env.SUMMARY }}

  manual-approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'pull_request'
    steps:
      - name: Await Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          approvers: your-github-username
          secret: ${{ secrets.GITHUB_TOKEN }}
          minimum-approvals: 1
          issue-title: "Approve Terraform Apply"
          issue-body: "Please approve to proceed with terraform apply."

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: manual-approval
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.out || true
